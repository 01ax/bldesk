name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Typed API Schema
        run: npm run generate-api

      - name: Build Web Application
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r out/renderer/* android/app/src/main/assets/public/

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/BLDesk-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLDesk-android-apk
          path: release/BLDesk-android.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/BLDesk-android.apk
          draft: false
          prerelease: false
          generate_release_notes: false
