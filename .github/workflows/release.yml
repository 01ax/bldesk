name: Build & Release Multi-OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Typed API Schema
        run: npm run generate-api

      - name: Build Application Bundle
        run: npm run build

      # --- WINDOWS BUILD ---
      - name: Package for Windows (x64)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          npm run pack:win
          Compress-Archive -Path release/BLDesk-win32-x64 -DestinationPath release/BLDesk-win-x64.zip

      # --- MACOS BUILD (Universal: Apple Silicon & Intel) ---
      - name: Package for macOS (Universal)
        if: matrix.os == 'macos-latest'
        run: |
          npm run pack:mac
          cd release
          zip -r -y BLDesk-mac-universal.zip BLDesk-darwin-universal/BLDesk.app

      # --- UPLOAD ARTIFACTS TO WORKFLOW RUN ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BLDesk-${{ matrix.os }}
          path: release/*.zip

      # --- PUBLISH GITHUB RELEASE ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
